name: keepalive
on:
  schedule:
    - cron: "17 3 */2 * *"      # every 2 days
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and touch the database
        env:
          API_BASE_URL: ${{ secrets.API_BASE_URL || vars.API_BASE_URL || 'https://knowledge-assistant-api-11ek.onrender.com' }}
        run: |
          # Normalize base URL by stripping trailing slash, /api/v1, or /health
          BASE="${API_BASE_URL%/}"
          BASE="${BASE%/api/v1}"
          BASE="${BASE%/health/deep}"
          BASE="${BASE%/health}"

          TARGET="${BASE}/api/v1/health/deep"
          echo "Pinging ${TARGET} to keep Render backend and Supabase database alive..."
          curl --retry 5 --retry-delay 20 --max-time 120 -fsS "${TARGET}"

