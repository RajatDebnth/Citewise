name: keepalive
on:
  schedule:
    - cron: "17 3 */2 * *"      # every 2 days
  workflow_dispatch: {}
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Wake API and touch the database
        run: |
          curl --retry 5 --retry-delay 20 --max-time 120 -fsS "${{ secrets.API_BASE_URL }}/health/deep"

