services:
  test-db:
    image: pgvector/pgvector:pg16
    container_name: knowledge-assistant-test-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: postgres
    ports:
      - "54322:5432"
    volumes:
      - pgvector-test-data:/var/lib/postgresql/data

volumes:
  pgvector-test-data:

